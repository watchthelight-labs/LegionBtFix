name: build
on:
  push:
  pull_request:
  release:
    types: [published]
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: tools/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LegionBtFix
          path: out/LegionBtFix.kext
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p LegionBtFix-${GITHUB_REF_NAME}
          cp -R out/LegionBtFix.kext LICENSE LegionBtFix-${GITHUB_REF_NAME}/
          zip -r LegionBtFix-${GITHUB_REF_NAME}-ci.zip LegionBtFix-${GITHUB_REF_NAME}
          gh release upload "$GITHUB_REF_NAME" LegionBtFix-${GITHUB_REF_NAME}-ci.zip
